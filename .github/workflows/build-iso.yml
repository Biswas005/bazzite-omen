name: Build Bazzite-Omen ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './iso.toml'
      - './.github/workflows/build-iso.yml'
      - './Justfile'
      - './Containerfile'
  push:
    branches:
      - main
    paths:
      - './iso.toml'
      - './Containerfile'

env:
  IMAGE_NAME: "bazzite-omen"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  BUILDER_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build Bazzite-Omen ISO (${{ inputs.platform || 'amd64' }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform && fromJson(format('["{0}"]', inputs.platform)) || fromJson('["amd64"]') }}

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Lowercase registry
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Setup QEMU for cross-arch
        uses: docker/setup-qemu-action@v3

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Map platform to arch
        run: |
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            echo "ARCH=x86_64" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            echo "ARCH=aarch64" >> $GITHUB_ENV
          else
            echo "Unsupported platform: ${{ matrix.platform }}" >&2
            exit 1
          fi

      - name: Prepare output and keys directory
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /var/lib/containers/storage /etc/containers ./output ./keys
          echo '[storage]
          driver = "overlay"
          runroot = "/run/containers/storage"
          graphroot = "/var/lib/containers/storage"' | sudo tee /etc/containers/storage.conf

      - name: Download Terra Mesa GPG Key
        run: |
          curl -o ./keys/RPM-GPG-KEY-terra42-mesa https://repos.fyralabs.com/terra42-mesa/key.asc || { echo "Key download failed; check URL or use fedora-42" >&2; exit 1; }

      - name: Pull required images
        run: |
          sudo podman pull ${{ env.BUILDER_IMAGE }}
          sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      - name: Build Bazzite-Omen ISO (manual)
        id: build
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume ./output:/output \
            --volume ./iso.toml:/config.toml:ro \
            --volume ./keys:/etc/pki/rpm-gpg:ro \
            ${{ env.BUILDER_IMAGE }} build \
            --output /output --rootfs btrfs --target-arch ${{ env.ARCH }} --type iso \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          echo "output-directory=$(pwd)/output" >> $GITHUB_OUTPUT

      - name: Move and rename ISO files
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          ISO_NAME="bazzite-omen-${{ github.run_id }}-${{ matrix.platform }}"
          OUTPUT_DIR="${{ steps.build.outputs.output-directory }}"
          if [ -f "${OUTPUT_DIR}/bootiso/install.iso" ]; then
            mv "${OUTPUT_DIR}/bootiso/install.iso" "${OUTPUT_DIR}/${ISO_NAME}.iso"
            cd "${OUTPUT_DIR}"
            sha256sum "${ISO_NAME}.iso" > "${ISO_NAME}.iso.sha256"
            echo "iso_filename=${ISO_NAME}.iso" >> $GITHUB_OUTPUT
          else
            echo "No ISO found in ${OUTPUT_DIR}/bootiso/install.iso; check build logs." >&2
            exit 1
          fi
        id: rename

      - name: Upload ISO to Job Artifacts
        if: steps.build.outcome == 'success' && inputs.upload-to-s3 != true
        uses: actions/upload-artifact@v4
        with:
          name: bazzite-omen-iso-${{ github.run_id }}-${{ matrix.platform }}
          path: |
            ${{ steps.build.outputs.output-directory }}/*.iso
            ${{ steps.build.outputs.output-directory }}/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: steps.build.outcome == 'success' && inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone || { echo "rclone install failed" >&2; exit 1; }
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}/bazzite-omen/iso/ \
            --include "*.iso" --include "*.sha256" \
            --s3-chunk-size 64M \
            --transfers 4 || { echo "S3 upload failed" >&2; exit 1; }

      - name: Create Release Summary
        if: steps.build.outcome == 'success'
        run: |
          echo "## 🎉 Bazzite-Omen ISO Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Image**: Bazzite NVIDIA" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: HP Omen Gaming Laptops" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.rename.outputs.iso_filename }}" ]; then
            echo "### Generated Files:" >> $GITHUB_STEP_SUMMARY
            echo "- ISO: \`${{ steps.rename.outputs.iso_filename }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Checksum: \`${{ steps.rename.outputs.iso_filename }}.sha256\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.upload-to-s3 }}" == "true" ]; then
            echo "- **Status**: ✅ Uploaded to S3" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status**: ✅ Available in Job Artifacts" >> $GITHUB_STEP_SUMMARY
          fi